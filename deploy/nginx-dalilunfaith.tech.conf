# Конфиг для ХОСТОВОГО nginx (общий reverse-proxy на сервере),
# не для контейнера — тот проксирует только /api внутри docker-compose (см. ../nginx.conf).
#
# Установка:
#   sudo cp deploy/nginx-dalilunfaith.tech.conf /etc/nginx/sites-available/dalilunfaith.tech.conf
#   sudo ln -s /etc/nginx/sites-available/dalilunfaith.tech.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Если сайт сейчас отдаётся другим конфигом (без Docker) — сначала уберите/отключите
# старый sites-enabled конфиг для этого домена, иначе nginx -t упадёт на дублирующемся
# server_name или порту.
#
# Предполагается, что docker-compose уже поднят и слушает на хосте порт из WEB_PORT (.env),
# по умолчанию 8080. Если меняли WEB_PORT — поправьте proxy_pass ниже.

server {
    listen 80;
    listen [::]:80;
    server_name dalilunfaith.tech www.dalilunfaith.tech;

    # Нужен для продления сертификата через certbot (webroot/renew)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dalilunfaith.tech www.dalilunfaith.tech;

    ssl_certificate     /etc/letsencrypt/live/dalilunfaith.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dalilunfaith.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
